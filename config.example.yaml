# ---------------------------------------------------------------------------
# Lockstep configuration.  Copy to config.yaml and fill in.
# config.yaml is gitignored -- it holds live secrets.
# ---------------------------------------------------------------------------

timezone: Asia/Almaty

telegram:
  bot_token: "PUT_BOTFATHER_TOKEN_HERE"
  user_chat_id: 0          # your numeric Telegram id      (get from @userinfobot)
  user_name: YOUR_FIRST_NAME   # what the guardian sees you called
  guardian_chat_id: 0      # your father's numeric Telegram id

gemini:
  api_key: "PUT_GEMINI_KEY_HERE"          # aistudio.google.com/apikey
  # Measured on this exact workload: flash-lite is ~5x cheaper than full flash
  # and got every test verdict right. Reading a clock and recognising a gym is
  # perception, not reasoning, so the bigger model buys nothing here.
  model: "gemini-3.1-flash-lite"
  thinking_budget: 0                      # null to re-enable thinking

  # The free tier allows 20 requests/day PER MODEL. These are tried in order
  # when one is exhausted, which is enough to run the whole thing free while
  # you're still setting up. Paid tier makes this irrelevant.
  models:
    - "gemini-3.1-flash-lite"
    - "gemini-3.5-flash-lite"
    - "gemini-flash-lite-latest"
    - "gemini-3.6-flash"

schedule:
  earliest: '06:00'      # a plan may reach this early, no earlier
  enforce_start: "16:00"          # proof window opens
  enforce_end:   "22:00"          # proof window closes

  # block_start = prove the session once, at the top of each block, then be
  #   left alone. Three blocker screenshots a minute apart, plus a photo of the
  #   activity itself for anything that isn't `work:`. Being interrupted every
  #   few minutes is its own stressor, and a system that raises your cortisol to
  #   make you work has traded one problem for another.
  # spot_check  = unpredictable checks throughout each block
  # fixed       = every N minutes, predictable
  mode: block_start
  spot_check_avg_min: 45          # roughly one check per this much planned time
  spot_check_min_gap_min: 20      # never two checks closer than this
  checkpoint_interval_min: 15     # only used when mode: fixed

  grace_min: 5                    # how long you get to answer before it counts as ignoring
  plan_due: "23:30"               # tomorrow's plan must be submitted by this time
  plan_nag_times: ["20:00", "21:30", "23:00"]
  daily_report_at: "22:15"

commitment:
  # How long a stop waits before taking effect. An urge is a state, not a
  # decision, and states pass -- so the exit is a delay rather than a wall.
  # Costs nothing to someone with a real reason; costs everything to a craving.
  stop_delay_hours: 24

  # A file holding your own reasoning for doing this, in your own words. The
  # bot reads it fresh each time and shows it to you before it will even take a
  # request to stop. It cannot prevent anything -- it is a mirror, not a lock.
  # Point it at a note in your Obsidian vault.
  why_file: ""
  start: "2026-08-25"       # day one
  months: 3                 # you cannot disable before start + this many months
  total_months: 12          # the full run you're aiming at

extend:
  # /more — the task you're on is overrunning and still going. Different from
  # an offset: nothing external happened, the plan was just optimistic.
  # Costs you the time (the day ends later), and only works on a block you have
  # already sent a valid photo for.
  max_minutes_per_day: 90

offset:
  max_per_day: 1
  minutes: 60
  require_photo: true

escalation:
  # The phone is the entire enforcement surface. There is no laptop agent.
  step_minutes: 20             # escalation level goes up every this many minutes behind
  phone_poll_sec: 60           # how often the phone asks the server how you're doing
  phone_alarm_after_min: 5     # start the alarm-stream siren after this much debt
  phone_alarm_volume_pct: 85   # % of the ALARM stream's max. Tuned upward twice
                               # from a first guess of 55 -- trust use, not
                               # theory. Your ringtone and media volume are
                               # never touched either way.
                               # If it still sounds quiet at 85, the problem is
                               # the sound FILE, not the stream: a quiet mp3
                               # stays quiet at any volume setting.

  # Escalation is repetition, not volume: the siren stays at the percentage
  # above, but goes off more times per minute the further behind you get.
  # The macro only fires once a minute, so a single beep leaves 58 seconds of
  # silence -- easy to sit through. These control how long each burst lasts.
  phone_repeats_base: 10       # times it sounds per poll at level 0
  phone_repeats_per_step: 2    # +this many per 20 minutes behind
  phone_repeats_max: 15        # ceiling -- see the warning below

  # Keep the burst under ~50 seconds. The macro is triggered once a minute, so
  # if one burst runs longer than that the next trigger lands on top of it and
  # MacroDroid either queues or drops it. With a ~2s sound and a 1s wait, 15
  # repeats is about 45s, which fits. If you raise the ceiling, shorten the
  # wait in the macro to match.

vision:
  timestamp_tolerance_min: 12  # how stale a visible clock may be
  min_confidence: 0.55
  max_retries: 3

  # Cold Turkey proof for laptop work.  A photo proves a moment, not an
  # interval -- you could open the right tab, snap, and switch straight back.
  # With this on, the first check of every `work` block must be a FULL-SCREEN
  # screenshot showing Cold Turkey blocking, its timer running, the allowlist,
  # and the taskbar clock.  Turn on when you're on the Windows laptop.
  require_blocker_for_work: false
  blocker_name: "Cold Turkey"

proof:
  shot_gap_min: 1              # minutes between the three blocker screenshots

heartbeat:
  # A URL that must be pinged regularly or an alarm fires SOMEWHERE ELSE.
  # Make a free check at healthchecks.io, set the period to 15 minutes, and
  # point its alert at the GUARDIAN's email -- not yours. Then the account that
  # notices the system dying is not an account you control.
  #
  # This is the only part of the project that survives you owning the server,
  # because the signal is the absence of a ping. There is nothing to switch off.
  url: ""
  every_sec: 300

reminders:
  # A one-off thing you'd otherwise forget. Fires three times: the evening
  # before (while you're writing tomorrow's plan and could put it in), the
  # morning of, and shortly before the thing itself.
  evening_before_at: "20:00"
  morning_at: "08:00"
  soon_minutes: 60

apps:
  # Distraction blocker (Switchly) control, driven by the phone's existing poll.
  # No second bot, no Telegram webhook -- see the note in agent-android/.
  unlock_minutes: 10           # how long the guardian's /unblock opens it for
  unlock_cooldown_days: 7      # and how rarely that may happen

privacy:
  enforce: true                # reject photos that break the rules below
  no_faces: true               # any identifiable face, yours or anyone's
  no_identity: true            # names, logins, emails, account names on screen
  no_location: true            # windows, streets, buildings, landmarks
  # Every photo is downscaled and stripped of metadata (GPS included) before it
  # is sent anywhere or written to disk.
  max_dimension: 1024          # verified: the timestamp still reads at 512px
  store_photos: thumbnail      # full | thumbnail | none
  thumbnail_dimension: 320
  retain_days: 7               # 0 = keep forever
  warn_on_gps: true            # tell you if your camera is tagging coordinates

  # Remind you to frame tight on blocks that happen outdoors. Downscaling does
  # NOT hide a skyline -- only framing does.
  framing_hint_categories: ["sport", "commute", "relax"]

api:
  host: "0.0.0.0"
  port: 8765
  token: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
goals:
  min: 3          # fewest goals a day may have
  max: 5          # more than this is a wish list, not priorities
